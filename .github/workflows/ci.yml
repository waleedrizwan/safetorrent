name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macOS: the host script relies on BSD tools (stat -f, xattr) and macOS's bash 3.2.
    runs-on: macos-latest
    strategy:
      matrix:
        # 3.9 is macOS's /usr/bin/python3 (the app server); 3.12 is Ubuntu 24.04's (the VM agent).
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        # Terminal's default locale; the bash script once broke only under UTF-8.
        env:
          LC_ALL: en_US.UTF-8
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9 mypy==1.11.2 shellcheck-py==0.10.0.1
      - name: ruff
        # B905 (zip strict=) needs Python 3.10, and the app server runs on macOS's 3.9.
        run: ruff check --select E,F,W,B --ignore E501,B905 vm gui tests
      - name: mypy
        run: mypy --ignore-missing-imports --python-version 3.9 vm/st-guest.py gui/server.py
      - name: shellcheck
        run: shellcheck safetorrent gui/launch.sh gui/make-app.sh
